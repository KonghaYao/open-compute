name: Deploy Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_BASE_URL: ${{ vars.OPEN_COMPUTE_API_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OPEN_COMPUTE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.OPEN_COMPUTE_DEPLOYER_TOKEN }}
      WRANGLER_LOG_SANITIZE: "true"
      CF_SEND_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show non-secret deployment identity
        run: printf 'origin=%s account=%s cf=' "$CLOUDFLARE_API_BASE_URL" "$CLOUDFLARE_ACCOUNT_ID" && node node_modules/cf/bin/cf --version
      - run: bun run --cwd examples/hello-worker build
      - run: bun run --cwd examples/hello-worker deploy:ci
