name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "examples/container/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(awk '/^\[workspace.package\]/{section=1; next} section && /^version = "/ {gsub(/version = "|"/, "", $0); print; exit}' Cargo.toml)"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release binaries
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://github.com/elliothux/open-compute/releases/download/${RELEASE_TAG}"
          curl -fsSL --http1.1 -o /tmp/SHA256SUMS "${base}/SHA256SUMS"
          for target in linux-x64 linux-arm64; do
            asset="ocd-${RELEASE_TAG}-${target}"
            curl -fsSL --http1.1 -o "examples/container/ocd.${target}" "${base}/${asset}"
            expected="$(awk -v name="${asset}" '$2 == name { print $1; found=1 } END { exit !found }' /tmp/SHA256SUMS)"
            actual="$(sha256sum "examples/container/ocd.${target}" | awk '{print $1}')"
            test "${expected}" = "${actual}"
            chmod 0555 "examples/container/ocd.${target}"
          done

      - name: Docker metadata (runtime)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: examples/container
          file: examples/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Build and push init image
        uses: docker/build-push-action@v6
        with:
          context: examples/container
          file: examples/container/Dockerfile.init
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-init:${{ needs.resolve-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-init:${{ needs.resolve-version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-init:latest
          provenance: false

      - name: Validate compose files
        env:
          OPEN_COMPUTE_ADMIN_TOKEN: ci-admin-token
          OPEN_COMPUTE_DEPLOYER_TOKEN: ci-deployer-token
          OPEN_COMPUTE_READ_ONLY_TOKEN: ci-readonly-token
        run: docker compose -f examples/container/docker-compose.yml config
